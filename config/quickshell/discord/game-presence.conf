# Discord Rich Presence bridge.
# Set enabled=false to stop cyan1de from setting your Discord activity.
enabled=true

# Use Discord's public detectable-game list so recognized games show their
# official name and icon. Unknown games and offline machines use client_id.
use_discord_game_ids=true

# Fallback application for games Discord does not know, or while offline.
# Replace it with your own application ID from
# https://discord.com/developers/applications if you prefer.
client_id=1062648118375616594
