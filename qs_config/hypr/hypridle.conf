general {
    lock_cmd = /home/fish/.config/quickshell/lockscreen/lock.sh   # Quickshell lockscreen with crash watchdog
    before_sleep_cmd = loginctl lock-session    # lock before suspend
    after_sleep_cmd = hyprctl dispatch dpms on  # avoid having to press a key twice to turn on display
}

# Dim screen after 2.5 minutes (150s)
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

# Lock screen after 5 minutes (300s)
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Turn off screen after 5.5 minutes (330s)
listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Suspend laptop after 15 minutes (900s)
listener {
    timeout = 900
    on-timeout = systemctl suspend
}
